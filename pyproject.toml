[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonmapper"
dynamic = ["version"]
description = "Find, map and manage every Python interpreter, virtual environment, conda env and Jupyter kernel on your machine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Daniel Margolis" }]
dependencies = []
keywords = ["python", "virtualenv", "conda", "mamba", "jupyter", "environments", "packages", "pip"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
pymapper = "pymapper.cli:main"

[tool.setuptools]
packages = ["pymapper"]

[tool.setuptools.package-data]
pymapper = ["ui.html"]

[tool.setuptools.dynamic]
version = { attr = "pymapper.__version__" }
